name: Siemens SOMATOM go.Sim
category: CT
protocol: CT Daily QA

sections:

  - key: ct_daily
    name: CT Daily QA

    tests:

      - key: gantry_moving_laser_alignment
        name: Gantry / Moving Laser Alignment
        type: boolean
        history: false

      - key: moving_laser_scan_plane_alignment
        name: Moving Laser / Scan Plane Alignment
        type: boolean
        history: false

      - key: spatial_integrity
        name: Spatial Integrity (distance)
        type: numeric
        unit: mm
        tolerance: 1
        history: false

      - key: hu_water
        name: CT Number Accuracy of Water
        type: numeric
        unit: HU
        reference: 0
        tolerance: 5
        history: true

      - key: hu_air
        name: CT Number Accuracy of Air
        type: numeric
        unit: HU
        reference: -1000
        tolerance: 5
        history: true

      - key: noise_water
        name: Image Noise of Water
        type: numeric
        unit: HU
        reference: 4
        tolerance: 1
        history: true

      - key: noise_air
        name: Image Noise of Air
        type: numeric
        unit: HU
        reference: 2
        tolerance: 1
        history: true

  - key: sentinel_daily
    name: Sentinel Daily QA

    tests:

      - key: sentinel_isocenter_check
        name: Sentinel Isocenter Check
        type: boolean
        history: false

      - key: couch_profile_deviation
        name: Couch Profile Deviation
        type: numeric
        unit: mm
        reference: 0
        tolerance: 3
        history: true